version: '3.8'

services:
  tts:
    build:
      context: .
      dockerfile: Dockerfile
    image: coqui-tts:latest
    container_name: coqui-tts

    # Configuración para GPU NVIDIA (RTX 5080)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Variables de entorno
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - COQUI_TOS_AGREED=1

    # Volúmenes para persistencia
    volumes:
      - ./models:/workspace/models
      - ./output:/workspace/output
      - ./data:/workspace/data

    # Puerto para el servidor TTS
    ports:
      - "8001:5002"

    # Comando por defecto (puede sobrescribirse)
    command: ["--help"]

    # Reinicio automático
    restart: unless-stopped

  # Servicio para ejecutar el servidor TTS
  tts-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: coqui-tts:latest
    container_name: coqui-tts-server

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - COQUI_TOS_AGREED=1
      - TTS_HOME=/workspace/models

    volumes:
      - ./models:/workspace/models
      - ./output:/workspace/output
      - ./data:/workspace/data

    ports:
      - "8001:5002"

    # Iniciar el servidor TTS
    entrypoint: ["tts-server"]
    command: ["--port", "5002", "--model_name", "tts_models/multilingual/multi-dataset/xtts_v2"]

    restart: unless-stopped

networks:
  default:
    name: coqui-network
